name: CI
on:
  push:
  pull_request:
jobs:
  synthetic-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile app/server.py scripts/drill.py
      - run: python3 scripts/drill.py
